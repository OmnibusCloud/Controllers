name: AI Verify
run-name: "AI Verify: ${{ github.event.pull_request.title || github.ref_name }}"

# The Verify controller on the three node platforms: the wire-layout and schema guards,
# the sandbox verdict, adversarial, raw-WASI and Python-layer suites against the pinned
# runtime set (built from its pins by verify-assets, so nothing is Assert.Ignore'd here),
# the worker pool and the benchmark, the taskset pipelines, every bundled script end to
# end through the engine on in-process nodes, and the module self-containment proof.
# Load tests (Category=Load) are not part of the sweep.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AI/**'
      - 'Grid/**'
      - 'Build/**'
      - 'nuget.config'
      - '.github/workflows/ai-verify.yml'
  push:
    branches: [main, ai-controllers]
    paths:
      - 'AI/**'
      - 'Grid/**'
      - 'Build/**'
      - 'nuget.config'
      - '.github/workflows/ai-verify.yml'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # AspectInjector (a build-time dependency of OutWit.Common) ships a native
      # osx-arm64 helper that Apple Silicon kills on launch ("Killed: 9") when
      # its signature is missing or invalid. An ad-hoc signature after the
      # restore lets the build through.
      - name: Restore and sign the AspectInjector helper (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet restore AI/OutWit.Controller.AI.Verify.Tests/OutWit.Controller.AI.Verify.Tests.csproj
          for helper in "$HOME"/.nuget/packages/aspectinjector/*/build/_bin/osx-arm64/AspectInjector; do
            chmod +x "$helper"
            codesign --force -s - "$helper"
            codesign --verify --verbose "$helper"
          done

      # The pinned downloads (the CPython-WASI build, QuickJS, the sympy and mpmath
      # wheels) are cached by the pins file; the bytecode layers are compiled by the
      # pinned interpreter on every run (~30 s) so the set is exactly what the catalog pins.
      - name: Cache the runtime downloads
        uses: actions/cache@v4
        with:
          path: AI/OutWit.Controller.AI.Verify.Tests/@Data/@Downloads
          key: verify-runtime-downloads-${{ hashFiles('AI/OutWit.Controller.AI.Verify.Assets/AssetPins.cs') }}

      - name: Build the runtime set
        shell: bash
        run: |
          dotnet run --project AI/OutWit.Controller.AI.Verify.Assets/OutWit.Controller.AI.Verify.Assets.csproj -c Release -- build AI/OutWit.Controller.AI.Verify.Tests/@Data/runtimes --clean

      # The Wasmtime package brings its own native library; the controller ships the newest
      # patch of the engine's line instead (pinned in toolchain/pins.env), and the wasm host
      # refuses any other (its natives guard). natives.sh lays the pinned libraries out before the
      # build, whose WasmHostPinnedNatives step (AI/Shared/WasmHostPinnedNatives.targets) puts this
      # platform's in place of the package's copy in every output that runs the host.
      - name: Cache the engine downloads
        uses: actions/cache@v4
        with:
          path: AI/OutWit.Controller.AI.Verify.Tests/@Data/natives/.downloads
          key: verify-engine-natives-${{ hashFiles('AI/OutWit.Controller.AI.Verify.Assets/toolchain/pins.env') }}

      - name: The pinned engine library
        shell: bash
        run: |
          bash AI/OutWit.Controller.AI.Verify.Assets/toolchain/natives.sh AI/OutWit.Controller.AI.Verify.Tests/@Data/natives
          grep -h "wasmtime [0-9]" AI/OutWit.Controller.AI.Verify.Tests/@Data/natives/win-x64/NOTICE.txt

      - name: Build
        shell: bash
        run: dotnet build AI/OutWit.Controller.AI.Verify.Tests/OutWit.Controller.AI.Verify.Tests.csproj -c Release

      # The outputs that run the host hold the pinned library, byte for byte (a re-signed copy
      # would be another file to the natives guard).
      - name: The pinned engine library under the tests
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) rid=win-x64;   lib=wasmtime.dll ;;
            Linux)   rid=linux-x64; lib=libwasmtime.so ;;
            macOS)   rid=osx-arm64; lib=libwasmtime.dylib ;;
          esac
          pinned="AI/OutWit.Controller.AI.Verify.Tests/@Data/natives/$rid/$lib"
          for project in OutWit.Controller.AI.Verify.Tests OutWit.Controller.AI.Verify.Tests.TrapHost; do
            bin="AI/$project/bin/Release/net10.0/runtimes/$rid/native/$lib"
            cmp -s "$pinned" "$bin" || { echo "::error::$project does not hold the pinned $rid/$lib"; exit 1; }
            if [ "$RUNNER_OS" = "macOS" ]; then codesign --verify --verbose "$bin"; fi
            if command -v sha256sum > /dev/null; then sha256sum "$bin"; else shasum -a 256 "$bin"; fi
          done

      - name: Verify
        run: dotnet test AI/OutWit.Controller.AI.Verify.Tests/OutWit.Controller.AI.Verify.Tests.csproj -c Release --no-build --filter Category!=Load --logger "console;verbosity=normal"

      - name: Vision
        shell: bash
        run: |
          dotnet build AI/OutWit.Controller.AI.Vision.Tests/OutWit.Controller.AI.Vision.Tests.csproj -c Release
          dotnet test AI/OutWit.Controller.AI.Vision.Tests/OutWit.Controller.AI.Vision.Tests.csproj -c Release --no-build

      # Grid: the allocator, the copies and the fault-tolerant reassignment on synthetic fleets.
      - name: Grid
        shell: bash
        run: |
          dotnet build Grid/OutWit.Controller.Grid.Tests/OutWit.Controller.Grid.Tests.csproj -c Debug
          dotnet test Grid/OutWit.Controller.Grid.Tests/OutWit.Controller.Grid.Tests.csproj -c Debug --no-build --logger "console;verbosity=normal"

      # The PDF stage's extractor module: the data asset Corpus declares (corpus-pdftext-wasm,
      # its URI and SHA-256 read from the controller's project file), fetched from its release,
      # checked against the pin and extracted into the tests' @Data the way it extracts beside the
      # controller. The PDF tests (the contract and hostile sets, the WARC fixture's product) run
      # on it and pin their products, so a difference between platforms fails here; on the build
      # server a missing module is a failure, not a skip.
      - name: Cache the PDF extractor module
        uses: actions/cache@v4
        with:
          path: AI/OutWit.Controller.AI.Corpus.Tests/@Data/.downloads
          key: corpus-pdftext-${{ hashFiles('AI/OutWit.Controller.AI.Corpus/OutWit.Controller.AI.Corpus.csproj') }}

      - name: The PDF extractor module under the tests
        shell: bash
        run: |
          project=AI/OutWit.Controller.AI.Corpus/OutWit.Controller.AI.Corpus.csproj
          data=AI/OutWit.Controller.AI.Corpus.Tests/@Data
          asset=$(sed -n '/Include="corpus-pdftext-wasm"/,/<\/ControllerDataAsset>/p' "$project")
          uri=$(printf '%s\n' "$asset" | sed -n 's:.*<Uri>\(.*\)</Uri>.*:\1:p')
          sha=$(printf '%s\n' "$asset" | sed -n 's:.*<Sha256>\(.*\)</Sha256>.*:\1:p')
          case "$uri" in gh-release://*) ;; *) echo "::error::unexpected asset URI '$uri'"; exit 1 ;; esac
          rest=${uri#gh-release://}
          repo=${rest%%/*}/$(printf '%s' "${rest#*/}" | cut -d/ -f1)
          tag=$(printf '%s' "$rest" | cut -d/ -f3)
          file=$(printf '%s' "$rest" | cut -d/ -f4)
          url="https://github.com/$repo/releases/download/$tag/$file"
          zip="$data/.downloads/$file"
          mkdir -p "$data/.downloads"
          if [ ! -f "$zip" ]; then
            curl -fsSL --retry 5 --retry-delay 10 -o "$zip.part" "$url" || { echo "::error::could not fetch $url"; exit 1; }
            mv "$zip.part" "$zip"
          fi
          if command -v sha256sum > /dev/null; then actual=$(sha256sum "$zip" | cut -d' ' -f1); else actual=$(shasum -a 256 "$zip" | cut -d' ' -f1); fi
          [ "$actual" = "$sha" ] || { echo "::error::$file hashes to $actual, not the pinned $sha"; rm -f "$zip"; exit 1; }
          if command -v python3 > /dev/null; then py=python3; else py=python; fi
          "$py" -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$zip" "$data"
          ls -l "$data/wasm"
          echo "$file $actual from $url"

      # The Corpus controller on the golden Common Crawl shards (committed fixtures): the stage
      # libraries, the PDF stage in its sandbox on the pinned engine library (the one the
      # controller ships, as under Verify), the node-side task against a loopback origin, and the
      # bundled scripts through the engine rig with in-process nodes.
      - name: Corpus
        shell: bash
        run: |
          dotnet build AI/OutWit.Controller.AI.Corpus.Tests/OutWit.Controller.AI.Corpus.Tests.csproj -c Release
          case "$RUNNER_OS" in
            Windows) rid=win-x64;   lib=wasmtime.dll ;;
            Linux)   rid=linux-x64; lib=libwasmtime.so ;;
            macOS)   rid=osx-arm64; lib=libwasmtime.dylib ;;
          esac
          bin=AI/OutWit.Controller.AI.Corpus.Tests/bin/Release/net10.0/runtimes/$rid/native/$lib
          cmp -s "AI/OutWit.Controller.AI.Verify.Tests/@Data/natives/$rid/$lib" "$bin" || { echo "::error::the Corpus test output does not hold the pinned $rid/$lib"; exit 1; }
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --verify --verbose "$bin"; fi
          dotnet test AI/OutWit.Controller.AI.Corpus.Tests/OutWit.Controller.AI.Corpus.Tests.csproj -c Release --no-build --filter "Category!=Load" --logger "console;verbosity=normal"
