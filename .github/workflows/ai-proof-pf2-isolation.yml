name: AI Proof PF-2 isolation
run-name: "AI Proof PF-2 isolation: ${{ github.ref_name }}"

# PF-2 of the Proof controller (a spike), isolation on every OS (feasibility only): a native kernel
# of the pinned toolchain (Lean 4.36.0), and the whole lake comparator tree, run raw and inside
# each OS's own sandbox - Linux bubblewrap (ours, and comparator's own `--ro-bind / /`), macOS
# sandbox-exec with a deny-by-default profile, a Windows AppContainer with a Job Object (our
# prototype) - on PF-1's kit R1; and the same probes inside each (a file outside the job folder,
# the user's home, a write outside, the processes, TCP to an address, to a name, to loopback).
# Nothing is published. A run starts when pf2/run/isolation.txt changes.

on:
  workflow_dispatch:
  push:
    branches:
      - spike/proof-pf2
    paths:
      - 'AI/OutWit.Controller.AI.Proof.Spike/pf2/run/isolation.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-proof-pf2-isolation-${{ github.ref }}
  cancel-in-progress: false

env:
  SPIKE: AI/OutWit.Controller.AI.Proof.Spike
  PF1: AI/OutWit.Controller.AI.Proof.Spike/pf1
  PF2: AI/OutWit.Controller.AI.Proof.Spike/pf2
  PYTHONUTF8: 1
  PYTHONDONTWRITEBYTECODE: 1
  PIN: 4.36.0

defaults:
  run:
    shell: bash

jobs:
  isolation:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-24.04, modes: "raw,bwrap,bwrap-host-ro" }
          - { rid: osx-arm64, os: macos-15, modes: "raw,sandbox-exec" }
          - { rid: win-x64, os: windows-2022, modes: "raw,job,appcontainer,appcontainer-lpac" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      OUT: results-isolation-${{ matrix.rid }}
      PF1_CGROUP: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: ${{ runner.os == 'Windows' }}
        with:
          global-json-file: global.json
      - name: Machine
        run: |
          pip install -q psutil
          python "$SPIKE/harness/machine.py" "$OUT/machine.json"
      - name: Toolchain
        run: python "$PF1/lean.py" fetch --version "$PIN" --rid "${{ matrix.rid }}" --dest "$PF0_WORK/tc" --record "$OUT/toolchain.json" --env-name PIN_ROOT
      - name: bubblewrap
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version | tee "$OUT/bwrap-version.txt"
      - name: The sandbox prototype and the firewall's state
        if: ${{ runner.os == 'Windows' }}
        run: |
          dotnet publish "$PF2/isolation/appcontainer/Pf2Sandbox.csproj" -c Release -o "$PF0_WORK/sandbox" -nologo -v q
          # Self-contained: inside the AppContainer a framework-dependent app cannot reach a .NET runtime
          # installed under the user's profile (run 6).
          dotnet publish "$PF2/isolation/which/Pf2Which.csproj" -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o "$PF0_WORK/which" -nologo -v q
          echo "SANDBOX=$PF0_WORK/sandbox/Pf2Sandbox.exe" >> "$GITHUB_ENV"
          echo "WHICH_DIR=$PF0_WORK/which" >> "$GITHUB_ENV"
          { netsh advfirewall show allprofiles state; sc query mpssvc; sc query bfe; } > "$OUT/firewall.txt" 2>&1 || true
          cat "$OUT/firewall.txt"
      - name: Kit R1 (PF-1's export and challenge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(python "$PF2/grh.py" pin R1_KIT_RUN)
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name kit-R1 --dir kit
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, os.environ["PF1"])
          from common import decompress
          job = os.path.join(os.environ["PF0_WORK"], "job")
          os.makedirs(job, exist_ok=True)
          for name in ("solution", "challenge"):
              print(name, decompress(f"kit/{name}.ndjson.zst", os.path.join(job, f"{name}.ndjson")))
          EOF
          rm -rf kit
      # A deny-by-default profile has to name everything a process needs to start (PF-2 run 1:
      # every process aborted at start); three variants, the sandbox's own denials logged.
      - name: sandbox-exec profiles
        if: ${{ runner.os == 'macOS' }}
        timeout-minutes: 20
        run: |
          chosen=""
          for v in strict system denylist; do
            PF2_SB_VARIANT=$v python "$PF2/isolation/isolation.py" probe --mode sandbox-exec --root "$PIN_ROOT" --job "$PF0_WORK/probe-job" --outside "$PF0_WORK/probe-outside" --out "$OUT/probe-sandbox-exec-$v.json" || true
            log show --last 3m --style compact --predicate 'sender == "Sandbox" OR eventMessage CONTAINS "deny("' 2>/dev/null | tail -60 > "$OUT/sandbox-log-$v.txt" || true
            ok=$(python -c "import json; d=json.load(open('$OUT/probe-sandbox-exec-$v.json')); print(1 if d['read-inside']['exit'] == 0 else 0)" 2>/dev/null || echo 0)
            echo "variant $v: read-inside works: $ok"
            if [ -z "$chosen" ] && [ "$ok" = 1 ]; then chosen=$v; fi
          done
          echo "PF2_SB_VARIANT=${chosen:-strict}" >> "$GITHUB_ENV"
          echo "${chosen:-none}" > "$OUT/sandbox-exec-variant.txt"
      - name: Probes
        timeout-minutes: 30
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            "$SANDBOX" probe --name pf2-probe --job-dir "$PF0_WORK/probe-job" --outside-dir "$PF0_WORK/probe-outside" > "$OUT/probe-appcontainer.json"
            "$SANDBOX" probe --name pf2-probe --job-dir "$PF0_WORK/probe-job" --outside-dir "$PF0_WORK/probe-outside" --lpac > "$OUT/probe-appcontainer-lpac.json"
            cat "$OUT"/probe-*.json
          else
            for mode in $(echo "${{ matrix.modes }}" | tr , ' '); do
              python "$PF2/isolation/isolation.py" probe --mode "$mode" --root "$PIN_ROOT" --job "$PF0_WORK/probe-job" --outside "$PF0_WORK/probe-outside" --out "$OUT/probe-$mode.json"
            done
          fi
      - name: Kernels and the comparator tree, raw and sandboxed
        timeout-minutes: 180
        run: |
          THEOREMS=$(python "$PF2/grh.py" pin R1_THEOREMS)
          for mode in $(echo "${{ matrix.modes }}" | tr , ' '); do
            python "$PF2/isolation/isolation.py" kernels --mode "$mode" --root "$PIN_ROOT" --job "$PF0_WORK/job" --theorems "$THEOREMS" --kernels nanoda-4,leanchecker,comparator --repeat 2 --out "$OUT/kernels.json" --sandbox "${SANDBOX:-}" --which-dir "${WHICH_DIR:-}" --memory-gib 6 --cap-min 30
          done
      # Run 5: under sandbox-exec the comparator still found no git; what `which` sees there.
      - name: sandbox-exec and the comparator's `which`
        if: ${{ runner.os == 'macOS' }}
        continue-on-error: true
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, os.path.join(os.environ["PF2"], "isolation"))
          sys.path.insert(0, os.environ["PF2"])
          import isolation
          root = os.path.realpath(os.environ["PIN_ROOT"])
          job = os.path.realpath(os.path.join(os.environ["PF0_WORK"], "job"))
          open(os.path.join(job, "diag.sb"), "w").write(isolation.macos_profile(root, job, False, "strict", tools=True))
          EOF
          { echo "PATH=$PATH"; command -v git; ls -la /usr/bin/which "$(command -v git)"; file /usr/bin/which; } > "$OUT/which-diag.txt" 2>&1
          for name in git env; do
            echo "--- which $name" >> "$OUT/which-diag.txt"
            sandbox-exec -f "$PF0_WORK/job/diag.sb" /usr/bin/which "$name" >> "$OUT/which-diag.txt" 2>&1; echo "exit $?" >> "$OUT/which-diag.txt"
          done
          sleep 2
          log show --last 2m --style compact --predicate 'sender == "Sandbox" OR eventMessage CONTAINS "deny("' 2>/dev/null | grep -i deny | tail -40 >> "$OUT/which-diag.txt" || true
          cat "$OUT/which-diag.txt"
      - name: A memory cap below what the kernel needs
        timeout-minutes: 30
        run: |
          THEOREMS=$(python "$PF2/grh.py" pin R1_THEOREMS)
          case "${{ runner.os }}" in
            Windows) mode=appcontainer ;;
            macOS) mode=sandbox-exec ;;
            *) mode=bwrap ;;
          esac
          python "$PF2/isolation/isolation.py" kernels --mode "$mode" --root "$PIN_ROOT" --job "$PF0_WORK/job" --theorems "$THEOREMS" --kernels nanoda-4 --out "$OUT/memcap.json" --sandbox "${SANDBOX:-}" --memory-gib 0.25 --cap-min 10
      - name: Remove the AppContainer profiles
        if: ${{ always() && runner.os == 'Windows' }}
        run: |
          "$SANDBOX" cleanup --name pf2-kernel --grant-read "$PIN_ROOT" --job-dir "$PF0_WORK/job" > "$OUT/cleanup-kernel.json" || true
          "$SANDBOX" cleanup --name pf2-probe --job-dir "$PF0_WORK/probe-job" > "$OUT/cleanup-probe.json" || true
          cat "$OUT"/cleanup-*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: results-isolation-${{ matrix.rid }}
          path: results-isolation-${{ matrix.rid }}
          retention-days: 14
