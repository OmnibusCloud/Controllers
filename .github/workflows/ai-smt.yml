name: AI Smt
run-name: "AI Smt: ${{ github.event.pull_request.title || github.ref_name }}"

# The Smt controller's language layer on the three node platforms: the SMT-LIB reader with its
# shape limits, held to the standard's lexicon and to the places where readers differ, and the
# sanitizer that makes a problem of a text or refuses it. The same code reads a problem in the
# application, on the host and on the node, so it is tested where each of them runs.
#
# One job more reads real problems: a slice of the SMT-LIB release, named by a committed list of
# paths and hashes, fetched from the collection's archives and never committed.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AI/OutWit.Controller.AI.Smt*/**'
      - 'Build/**'
      - 'nuget.config'
      - 'global.json'
      - '.github/workflows/ai-smt.yml'
  push:
    branches: [main]
    paths:
      - 'AI/OutWit.Controller.AI.Smt*/**'
      - 'Build/**'
      - 'nuget.config'
      - 'global.json'
      - '.github/workflows/ai-smt.yml'

# The jobs read the repository and nothing else: they build and test, and publish nothing.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The SDK global.json pins, exactly.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # AspectInjector (a build-time dependency of OutWit.Common) ships a native
      # osx-arm64 helper that Apple Silicon kills on launch ("Killed: 9") when
      # its signature is missing or invalid. An ad-hoc signature after the
      # restore lets the build through.
      - name: Restore and sign the AspectInjector helper (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet restore AI/OutWit.Controller.AI.Smt.Tests/OutWit.Controller.AI.Smt.Tests.csproj
          for helper in "$HOME"/.nuget/packages/aspectinjector/*/build/_bin/osx-arm64/AspectInjector; do
            chmod +x "$helper"
            codesign --force -s - "$helper"
            codesign --verify --verbose "$helper"
          done

      - name: Build
        shell: bash
        run: dotnet build AI/OutWit.Controller.AI.Smt.Tests/OutWit.Controller.AI.Smt.Tests.csproj -c Release

      # Everything but the slice of real problems, which has a job of its own below.
      - name: Test
        shell: bash
        run: dotnet test AI/OutWit.Controller.AI.Smt.Tests/OutWit.Controller.AI.Smt.Tests.csproj -c Release --no-build --filter "Category!=Slice" --logger "console;verbosity=normal"

  # The sanitizer on 469 problems of the SMT-LIB release 2025: every one is sanitized, its
  # canonical text held to be a fixed point and its :status to be the list's verdict; the refusals
  # are counted by code and held to the numbers written in the test. The problems are not in the
  # repository: Slice/fetch.py streams the archives of the logics from Zenodo, keeps the listed
  # files and checks each against the SHA-256 of the list. They are kept between runs under the
  # hash of the list. Here a problem that is missing is a failure, not a skip.
  slice:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TESTS: AI/OutWit.Controller.AI.Smt.Tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache the slice
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: AI/OutWit.Controller.AI.Smt.Tests/@Data/slice
          key: smt-slice-${{ hashFiles('AI/OutWit.Controller.AI.Smt.Tests/Slice/fetch-list.tsv') }}

      # A file that is already there is not fetched again: with the cache this step ends at once.
      # An archive is a stream of up to 1.7 GB; a stream that breaks leaves its files missing, and
      # the next try fetches only those.
      - name: Fetch the slice
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python3 -I "$TESTS/Slice/fetch.py" "$TESTS/Slice/fetch-list.tsv" "$TESTS/@Data/slice"; then
              exit 0
            fi
            echo "try $attempt left problems missing"
            sleep 30
          done
          exit 1

      - name: Build
        shell: bash
        run: dotnet build "$TESTS/OutWit.Controller.AI.Smt.Tests.csproj" -c Release

      - name: Test
        shell: bash
        run: dotnet test "$TESTS/OutWit.Controller.AI.Smt.Tests.csproj" -c Release --no-build --filter "Category=Slice" --logger "console;verbosity=normal"
