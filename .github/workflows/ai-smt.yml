name: AI Smt
run-name: "AI Smt: ${{ github.event.pull_request.title || github.ref_name }}"

# The Smt controller's language layer on the three node platforms: the SMT-LIB reader with its
# shape limits, held to the standard's lexicon and to the places where readers differ. The same
# code reads a problem in the application, on the host and on the node, so it is tested where
# each of them runs.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AI/OutWit.Controller.AI.Smt*/**'
      - 'Build/**'
      - 'nuget.config'
      - 'global.json'
      - '.github/workflows/ai-smt.yml'
  push:
    branches: [main]
    paths:
      - 'AI/OutWit.Controller.AI.Smt*/**'
      - 'Build/**'
      - 'nuget.config'
      - 'global.json'
      - '.github/workflows/ai-smt.yml'

# The jobs read the repository and nothing else: they build and test, and publish nothing.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The SDK global.json pins, exactly.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # AspectInjector (a build-time dependency of OutWit.Common) ships a native
      # osx-arm64 helper that Apple Silicon kills on launch ("Killed: 9") when
      # its signature is missing or invalid. An ad-hoc signature after the
      # restore lets the build through.
      - name: Restore and sign the AspectInjector helper (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet restore AI/OutWit.Controller.AI.Smt.Tests/OutWit.Controller.AI.Smt.Tests.csproj
          for helper in "$HOME"/.nuget/packages/aspectinjector/*/build/_bin/osx-arm64/AspectInjector; do
            chmod +x "$helper"
            codesign --force -s - "$helper"
            codesign --verify --verbose "$helper"
          done

      - name: Build
        shell: bash
        run: dotnet build AI/OutWit.Controller.AI.Smt.Tests/OutWit.Controller.AI.Smt.Tests.csproj -c Release

      - name: Test
        shell: bash
        run: dotnet test AI/OutWit.Controller.AI.Smt.Tests/OutWit.Controller.AI.Smt.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
