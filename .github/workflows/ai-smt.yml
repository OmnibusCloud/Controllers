name: AI Smt
run-name: "AI Smt: ${{ github.event.pull_request.title || github.ref_name }}"

# The Smt controller on the three node platforms. Its language layer: the SMT-LIB reader with
# its shape limits, the sanitizer that makes a problem of a text or refuses it, the model
# evaluator, the problem set. The same code reads a problem in the application, on the host and
# on the node, so it is tested where each of them runs. And the solver: the pinned Z3 module in
# the controller's wasm sandbox, one session a problem. The outcomes of the solver's test
# problems are held to one committed file of digests and fuel on all three platforms, which is
# the proof that a problem gives the same answer, the same model and the same cost everywhere.
#
# The module is built by the workflow "AI Smt toolchain", which this one calls as a job: two
# builds compared byte for byte and held to the toolchain's pins, taken from the cache when
# nothing of the toolchain changed. The test jobs take its archive, hold it to the pins again
# and unpack the module where the tests look for it; nothing of it is committed.
#
# One job more solves real problems: a slice of the SMT-LIB release, named by a committed list
# of paths and hashes, fetched from the collection's archives and never committed.
#
# The run of a problem set end to end (SmtRun through the engine with in-process nodes, honest
# and lying) is part of the test jobs. Its load test, ten thousand problems with the memory and
# every payload measured, is a job of its own on Linux.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AI/OutWit.Controller.AI.Smt*/**'
      - 'AI/Shared/**'
      - 'Grid/**'
      - 'Variables/**'
      - 'Build/**'
      - 'nuget.config'
      - 'global.json'
      - '.github/workflows/ai-smt.yml'
  push:
    branches: [main]
    paths:
      - 'AI/OutWit.Controller.AI.Smt*/**'
      - 'AI/Shared/**'
      - 'Grid/**'
      - 'Variables/**'
      - 'Build/**'
      - 'nuget.config'
      - 'global.json'
      - '.github/workflows/ai-smt.yml'

# The jobs read the repository and nothing else: they build and test, and publish nothing.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # The solver module, built or taken from the cache, compared, checked and run by the
  # toolchain's own workflow; its archive is the artifact smt-z3-wasm of this run. The workflow
  # is named by a commit, as every action of the repository is (a test holds every "uses" to
  # that form): the commit that made it callable. The version beside it is the controller's at
  # that commit. After a change to the toolchain's workflow the commit here is moved to it.
  module:
    uses: OmnibusCloud/Controllers/.github/workflows/ai-smt-toolchain.yml@4157a5f785ccdd66e78434d4fee9da6f77982d49 # v0.1.0

  tests:
    needs: module
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The SDK global.json pins, exactly.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # AspectInjector (a build-time dependency of OutWit.Common) ships a native
      # osx-arm64 helper that Apple Silicon kills on launch ("Killed: 9") when
      # its signature is missing or invalid. An ad-hoc signature after the
      # restore lets the build through.
      - name: Restore and sign the AspectInjector helper (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet restore AI/OutWit.Controller.AI.Smt.Tests/OutWit.Controller.AI.Smt.Tests.csproj
          for helper in "$HOME"/.nuget/packages/aspectinjector/*/build/_bin/osx-arm64/AspectInjector; do
            chmod +x "$helper"
            codesign --force -s - "$helper"
            codesign --verify --verbose "$helper"
          done

      # The Wasmtime package brings its own native library; the controllers ship the newest
      # patch of the engine's line instead, and the wasm host refuses any other (its natives
      # guard). natives.sh lays the pinned libraries out before the build, as under "AI Verify",
      # whose WasmHostPinnedNatives step (AI/Shared/WasmHostPinnedNatives.targets) puts this
      # platform's in place of the package's copy in the tests' output.
      - name: Cache the engine downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: AI/OutWit.Controller.AI.Verify.Tests/@Data/natives/.downloads
          key: verify-engine-natives-${{ hashFiles('AI/OutWit.Controller.AI.Verify.Assets/toolchain/pins.env') }}

      - name: The pinned engine library
        shell: bash
        run: bash AI/OutWit.Controller.AI.Verify.Assets/toolchain/natives.sh AI/OutWit.Controller.AI.Verify.Tests/@Data/natives

      - name: The solver module's archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smt-z3-wasm
          path: AI/OutWit.Controller.AI.Smt.Tests/@Data/.downloads

      # The archive and the module in it are the ones toolchain/pins.env pins, or nothing runs:
      # the controller holds the module to the same hash once more before it compiles it.
      - name: The solver module under the tests
        shell: bash
        run: |
          . AI/OutWit.Controller.AI.Smt.Assets/toolchain/pins.env
          data=AI/OutWit.Controller.AI.Smt.Tests/@Data
          zip="$data/.downloads/smt-z3-wasm.zip"
          sha() { if command -v sha256sum > /dev/null; then sha256sum "$1" | cut -d' ' -f1; else shasum -a 256 "$1" | cut -d' ' -f1; fi; }
          [ "$(sha "$zip")" = "$SMT_Z3_WASM_SHA256" ] || { echo "::error::smt-z3-wasm.zip hashes to $(sha "$zip"), not the pinned $SMT_Z3_WASM_SHA256"; exit 1; }
          if command -v python3 > /dev/null; then py=python3; else py=python; fi
          "$py" -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$zip" "$data"
          module="$data/wasm/z3-$Z3_VERSION.wasm"
          [ "$(sha "$module")" = "$Z3_MODULE_SHA256" ] || { echo "::error::the module of the archive hashes to $(sha "$module"), not the pinned $Z3_MODULE_SHA256"; exit 1; }
          ls -l "$data/wasm"

      # The packaged assets the module-load test and the asset test fetch from their releases (the
      # native library of this platform, the solver module), held to the project's pins on every
      # use; kept between runs under the hash of the project that pins them.
      - name: Cache the packaged assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: AI/OutWit.Controller.AI.Smt.Tests/@Data/.assets
          key: smt-packaged-assets-${{ runner.os }}-${{ hashFiles('AI/OutWit.Controller.AI.Smt/OutWit.Controller.AI.Smt.csproj') }}

      - name: Build
        shell: bash
        run: dotnet build AI/OutWit.Controller.AI.Smt.Tests/OutWit.Controller.AI.Smt.Tests.csproj -c Release

      # The scripts package: the three bundled scripts and the consumer's targets, nothing else.
      - name: Pack the scripts package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out="$RUNNER_TEMP/smt-scripts"
          dotnet pack AI/OutWit.Controller.AI.Smt.Scripts/OutWit.Controller.AI.Smt.Scripts.csproj -c Release -o "$out"
          python3 -I -c "import sys, zipfile; names = set(zipfile.ZipFile(sys.argv[1]).namelist()); want = {'content/scripts/SmtRun.wit', 'content/scripts/SmtPreflight.wit', 'content/scripts/SmtRuntimeDiagnostics.wit', 'build/OutWit.Controller.AI.Smt.Scripts.targets'}; missing = want - names; extra = {name for name in names if name.startswith('content/')} - want; sys.exit(f'missing {sorted(missing)}, extra {sorted(extra)}' if missing or extra else 0)" "$out"/OutWit.Controller.AI.Smt.Scripts.*.nupkg

      # The tests' output holds the pinned library, byte for byte (a re-signed copy would be
      # another file to the natives guard).
      - name: The pinned engine library under the tests
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) rid=win-x64;   lib=wasmtime.dll ;;
            Linux)   rid=linux-x64; lib=libwasmtime.so ;;
            macOS)   rid=osx-arm64; lib=libwasmtime.dylib ;;
          esac
          bin="AI/OutWit.Controller.AI.Smt.Tests/bin/Release/net10.0/runtimes/$rid/native/$lib"
          cmp -s "AI/OutWit.Controller.AI.Verify.Tests/@Data/natives/$rid/$lib" "$bin" || { echo "::error::the Smt test output does not hold the pinned $rid/$lib"; exit 1; }
          if [ "$RUNNER_OS" = "macOS" ]; then codesign --verify --verbose "$bin"; fi

      # Everything but the slice of real problems and the load test, which have jobs of their own
      # below. The log states how long the module's compile took on this platform, and each case's
      # digest and fuel.
      - name: Test
        shell: bash
        run: dotnet test AI/OutWit.Controller.AI.Smt.Tests/OutWit.Controller.AI.Smt.Tests.csproj -c Release --no-build --filter "Category!=Slice&Category!=Load" --logger "console;verbosity=normal"

  # The 469 problems of the SMT-LIB release 2025 the committed list names. The sanitizer: every
  # one is sanitized, its canonical text held to be a fixed point and its :status to be the
  # list's verdict; the refusals are counted by code and held to the numbers written in the test.
  # The solver: every one is solved as a check in a session of its own, and its verdict is the
  # list's; every model goes to the model evaluator, whose classes are counted by logic and held
  # to the numbers written in the test, with none failed; and every model the evaluator took a
  # side on is written back into its problem and handed to the solver again, which must agree.
  # The problems are not in the repository: Slice/fetch.py streams the archives of the logics
  # from Zenodo, keeps the listed files and checks each against the SHA-256 of the list. They
  # are kept between runs under the hash of the list. Here a problem that is missing is a
  # failure, not a skip.
  slice:
    needs: module
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TESTS: AI/OutWit.Controller.AI.Smt.Tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache the slice
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: AI/OutWit.Controller.AI.Smt.Tests/@Data/slice
          key: smt-slice-${{ hashFiles('AI/OutWit.Controller.AI.Smt.Tests/Slice/fetch-list.tsv') }}

      # A file that is already there is not fetched again: with the cache this step ends at once.
      # An archive is a stream of up to 1.7 GB; a stream that breaks leaves its files missing, and
      # the next try fetches only those.
      - name: Fetch the slice
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python3 -I "$TESTS/Slice/fetch.py" "$TESTS/Slice/fetch-list.tsv" "$TESTS/@Data/slice"; then
              exit 0
            fi
            echo "try $attempt left problems missing"
            sleep 30
          done
          exit 1

      - name: Cache the engine downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: AI/OutWit.Controller.AI.Verify.Tests/@Data/natives/.downloads
          key: verify-engine-natives-${{ hashFiles('AI/OutWit.Controller.AI.Verify.Assets/toolchain/pins.env') }}

      - name: The pinned engine library
        shell: bash
        run: bash AI/OutWit.Controller.AI.Verify.Assets/toolchain/natives.sh AI/OutWit.Controller.AI.Verify.Tests/@Data/natives

      - name: The solver module's archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smt-z3-wasm
          path: AI/OutWit.Controller.AI.Smt.Tests/@Data/.downloads

      - name: The solver module under the tests
        shell: bash
        run: |
          . AI/OutWit.Controller.AI.Smt.Assets/toolchain/pins.env
          data="$TESTS/@Data"
          zip="$data/.downloads/smt-z3-wasm.zip"
          echo "$SMT_Z3_WASM_SHA256  $zip" | sha256sum -c -
          python3 -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$zip" "$data"
          echo "$Z3_MODULE_SHA256  $data/wasm/z3-$Z3_VERSION.wasm" | sha256sum -c -

      - name: Build
        shell: bash
        run: dotnet build "$TESTS/OutWit.Controller.AI.Smt.Tests.csproj" -c Release

      # The log states the totals: the verdicts, the evaluator's classes by logic, the closed
      # scripts, the fuel, and how long each part took on this runner.
      - name: Test
        shell: bash
        run: dotnet test "$TESTS/OutWit.Controller.AI.Smt.Tests.csproj" -c Release --no-build --filter "Category=Slice" --logger "console;verbosity=normal"

  # The model evaluator against the solver itself, by volume: closed terms generated from a
  # fixed seed for each theory (integer and real arithmetic, linear and not, bit-vectors, arrays,
  # datatypes, functions with a model, strings, the core), each evaluated by the evaluator and
  # checked by the solver, which must agree wherever the evaluator gives a value. The test jobs
  # above run a few hundred of them on each platform; this one runs thousands. The log states
  # the totals of each theory: decided and agreed, partial by reason, disagreements.
  differential:
    needs: module
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TESTS: AI/OutWit.Controller.AI.Smt.Tests
      SMT_DIFFERENTIAL_TERMS: 600
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache the engine downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: AI/OutWit.Controller.AI.Verify.Tests/@Data/natives/.downloads
          key: verify-engine-natives-${{ hashFiles('AI/OutWit.Controller.AI.Verify.Assets/toolchain/pins.env') }}

      - name: The pinned engine library
        shell: bash
        run: bash AI/OutWit.Controller.AI.Verify.Assets/toolchain/natives.sh AI/OutWit.Controller.AI.Verify.Tests/@Data/natives

      - name: The solver module's archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smt-z3-wasm
          path: AI/OutWit.Controller.AI.Smt.Tests/@Data/.downloads

      - name: The solver module under the tests
        shell: bash
        run: |
          . AI/OutWit.Controller.AI.Smt.Assets/toolchain/pins.env
          data="$TESTS/@Data"
          zip="$data/.downloads/smt-z3-wasm.zip"
          echo "$SMT_Z3_WASM_SHA256  $zip" | sha256sum -c -
          python3 -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$zip" "$data"
          echo "$Z3_MODULE_SHA256  $data/wasm/z3-$Z3_VERSION.wasm" | sha256sum -c -

      - name: Build
        shell: bash
        run: dotnet build "$TESTS/OutWit.Controller.AI.Smt.Tests.csproj" -c Release

      - name: Test
        shell: bash
        run: dotnet test "$TESTS/OutWit.Controller.AI.Smt.Tests.csproj" -c Release --no-build --filter "Category=Differential" --logger "console;verbosity=normal"

  # Ten thousand small problems through SmtRun on three in-process nodes at the default sampling
  # rate, with the memory and every payload measured and held to bounds (SmtRunLoadTests). The log
  # states the time, the problems a second, the high-water marks of the heap and what every
  # message and every variable carried.
  load:
    needs: module
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      TESTS: AI/OutWit.Controller.AI.Smt.Tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache the engine downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: AI/OutWit.Controller.AI.Verify.Tests/@Data/natives/.downloads
          key: verify-engine-natives-${{ hashFiles('AI/OutWit.Controller.AI.Verify.Assets/toolchain/pins.env') }}

      - name: The pinned engine library
        shell: bash
        run: bash AI/OutWit.Controller.AI.Verify.Assets/toolchain/natives.sh AI/OutWit.Controller.AI.Verify.Tests/@Data/natives

      - name: The solver module's archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smt-z3-wasm
          path: AI/OutWit.Controller.AI.Smt.Tests/@Data/.downloads

      - name: The solver module under the tests
        shell: bash
        run: |
          . AI/OutWit.Controller.AI.Smt.Assets/toolchain/pins.env
          data="$TESTS/@Data"
          zip="$data/.downloads/smt-z3-wasm.zip"
          echo "$SMT_Z3_WASM_SHA256  $zip" | sha256sum -c -
          python3 -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$zip" "$data"
          echo "$Z3_MODULE_SHA256  $data/wasm/z3-$Z3_VERSION.wasm" | sha256sum -c -

      - name: Build
        shell: bash
        run: dotnet build "$TESTS/OutWit.Controller.AI.Smt.Tests.csproj" -c Release

      - name: Load
        shell: bash
        run: dotnet test "$TESTS/OutWit.Controller.AI.Smt.Tests.csproj" -c Release --no-build --filter "Category=Load" --logger "console;verbosity=detailed"
