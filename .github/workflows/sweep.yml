name: Sweep
run-name: "Sweep: ${{ github.event.pull_request.title || github.ref_name }}"

# The sweep and its solver families on the three node platforms: the Sweep
# engine gates (the bundled SweepCalculiX.wit and SweepOpenFOAM.wit through
# the engine SDK against the fake solvers), the fault gate, the model and
# family tests, and the CalculiX and OpenFOAM controller tests. No real
# solver is needed; the OpenFOAM kit oracle is openfoam-oracle.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sweep/**'
      - 'CalculiX/**'
      - 'OpenFOAM/**'
      - 'Build/**'
      - '.github/workflows/sweep.yml'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # AspectInjector (a build-time dependency of OutWit.Common) ships a native
      # osx-arm64 helper that Apple Silicon kills on launch ("Killed: 9") when
      # its signature is missing or invalid. An ad-hoc signature after the
      # restore lets the build through.
      - name: Restore and sign the AspectInjector helper (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet restore Sweep/OutWit.Controller.Sweep.Tests/OutWit.Controller.Sweep.Tests.csproj
          for helper in "$HOME"/.nuget/packages/aspectinjector/*/build/_bin/osx-arm64/AspectInjector; do
            chmod +x "$helper"
            codesign --force -s - "$helper"
            codesign --verify --verbose "$helper"
          done

      - name: Build
        shell: bash
        run: |
          # ContinuousIntegrationBuild turns the document generator into check
          # mode: a sweep.* shape change without regenerated Documents/ fails here.
          dotnet build Sweep/OutWit.Controller.Sweep.Tests/OutWit.Controller.Sweep.Tests.csproj -c Release -p:ContinuousIntegrationBuild=true
          dotnet build CalculiX/OutWit.Controller.CalculiX.Tests/OutWit.Controller.CalculiX.Tests.csproj -c Release
          dotnet build OpenFOAM/OutWit.Controller.OpenFOAM.Tests/OutWit.Controller.OpenFOAM.Tests.csproj -c Release

      - name: Sweep
        run: dotnet test Sweep/OutWit.Controller.Sweep.Tests/OutWit.Controller.Sweep.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: CalculiX
        run: dotnet test CalculiX/OutWit.Controller.CalculiX.Tests/OutWit.Controller.CalculiX.Tests.csproj -c Release --no-build

      - name: OpenFOAM (without the kit oracle)
        run: dotnet test OpenFOAM/OutWit.Controller.OpenFOAM.Tests/OutWit.Controller.OpenFOAM.Tests.csproj -c Release --no-build --filter Category!=Kit
