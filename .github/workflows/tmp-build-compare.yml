name: Temporary build comparison
run-name: "Temporary build comparison"

# Builds the twelve controllers twice on one commit, once with the build files (Build/) of the
# base of this branch and once with its own, and compares what the builds made: every module
# file, every zip entry and zip, every package entry under content/, build/ and lib/, and every
# content digest. The same commit on both sides, so the assemblies can be compared byte for
# byte. A third build on Windows with the branch's files gives the digests of the other system.
# The new side also runs the publish guard on the built Verify and Corpus packages, on a package
# whose manifest was changed, and on a Corpus package whose pin was moved by an Update item.
# Removed before the merge.

on:
  push:
    branches: [fix/d6-build]
    paths:
      - '.github/workflows/tmp-build-compare.yml'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  BASE: b007320

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.files }} build files, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - files: old
            os: ubuntu-latest
          - files: new
            os: ubuntu-latest
          - files: new
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The build files of the base
        if: matrix.files == 'old'
        run: |
          git checkout "$BASE" -- Build
          git status --short

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Twelve controllers
        run: |
          dotnet --version | tee sdk.txt
          set +e
          failed=0
          for p in \
            Grid/OutWit.Controller.Grid/OutWit.Controller.Grid.csproj \
            Variables/OutWit.Controller.Variables/OutWit.Controller.Variables.csproj \
            Special/OutWit.Controller.Special/OutWit.Controller.Special.csproj \
            Matrices/OutWit.Controller.Matrices/OutWit.Controller.Matrices.csproj \
            CalculiX/OutWit.Controller.CalculiX/OutWit.Controller.CalculiX.csproj \
            OpenFOAM/OutWit.Controller.OpenFOAM/OutWit.Controller.OpenFOAM.csproj \
            Sweep/OutWit.Controller.Sweep/OutWit.Controller.Sweep.csproj \
            Render/OutWit.Controller.Render/OutWit.Controller.Render.csproj \
            Render/OutWit.Controller.Render.Dcc/OutWit.Controller.Render.Dcc.csproj \
            Visualization/OutWit.Controller.Visualization.ParaView/OutWit.Controller.Visualization.ParaView.csproj \
            AI/OutWit.Controller.AI.Verify/OutWit.Controller.AI.Verify.csproj \
            AI/OutWit.Controller.AI.Corpus/OutWit.Controller.AI.Corpus.csproj; do
            echo "=== $p" | tee -a build.log
            dotnet build "$p" -c Release -nologo -v:m -p:ContinuousIntegrationBuild=true -p:ControllerBuildStamp=fixed >> build.log 2>&1
            code=$?
            echo "exit=$code $p" | tee -a build.log
            [ "$code" -eq 0 ] || failed=1
          done
          grep "content digest" build.log | sed 's/^ *//' > digests.txt
          cat digests.txt
          exit $failed

      - name: Snapshot
        run: |
          if command -v python3 > /dev/null; then py=python3; else py=python; fi
          "$py" -I - . > snapshot.txt <<'PY'
          import hashlib
          import os
          import sys
          import zipfile

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def file_sha(path):
              with open(path, "rb") as stream:
                  return sha(stream.read())

          root = sys.argv[1]
          modules = os.path.join(root, "@Controllers", "Release")
          print("== modules")
          rows = []
          for folder, _, names in os.walk(modules):
              for name in names:
                  full = os.path.join(folder, name)
                  rows.append((os.path.relpath(full, modules).replace(os.sep, "/"), os.path.getsize(full), file_sha(full)))
          for row in sorted(rows):
              print("   %-80s %10d %s" % row)
          zips = os.path.join(root, "@Zips", "Release")
          print("== zips")
          for name in sorted(os.listdir(zips)):
              full = os.path.join(zips, name)
              print("  -- %s %d %s" % (name, os.path.getsize(full), file_sha(full)))
              with zipfile.ZipFile(full) as archive:
                  for info in archive.infolist():
                      print("     %-76s %10d %s" % (info.filename, info.file_size, sha(archive.read(info))))
          print("== packages")
          found = []
          for folder, _, names in os.walk(root):
              for name in names:
                  if name.endswith(".nupkg") and (os.sep + "bin" + os.sep) in folder + os.sep:
                      found.append(os.path.join(folder, name))
          for full in sorted(found, key=lambda path: os.path.relpath(path, root).replace(os.sep, "/")):
              print("  -- %s (size %d)" % (os.path.relpath(full, root).replace(os.sep, "/"), os.path.getsize(full)))
              with zipfile.ZipFile(full) as archive:
                  for info in sorted(archive.infolist(), key=lambda entry: entry.filename):
                      if info.filename.startswith(("content/", "build/", "lib/")):
                          print("     %-76s %10d %s" % (info.filename, info.file_size, sha(archive.read(info))))
          PY
          wc -l snapshot.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compare-${{ matrix.files }}-${{ runner.os }}
          path: |
            sdk.txt
            build.log
            digests.txt
            snapshot.txt
          if-no-files-found: error

      # The guard of the publish workflow on what this build made.
      - name: The publish guard on the built Verify and Corpus packages
        if: matrix.files == 'new' && runner.os == 'Linux'
        run: |
          for p in AI/OutWit.Controller.AI.Verify/bin/Release/OutWit.Controller.AI.Verify.*.nupkg AI/OutWit.Controller.AI.Corpus/bin/Release/OutWit.Controller.AI.Corpus.*.nupkg; do
            echo "=== $p"
            bash .github/scripts/released-data-assets.sh "$p"
          done

      - name: The publish guard on a package whose manifest pins another archive (must fail)
        if: matrix.files == 'new' && runner.os == 'Linux'
        run: |
          package=$(ls AI/OutWit.Controller.AI.Corpus/bin/Release/OutWit.Controller.AI.Corpus.*.nupkg)
          python3 -I - "$package" "$RUNNER_TEMP/other-pin.nupkg" <<'PY'
          import json
          import sys
          import zipfile

          source, target = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(source) as archive, zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED) as out:
              for info in archive.infolist():
                  data = archive.read(info)
                  if info.filename == "content/module/controller.json":
                      manifest = json.loads(data.decode("utf-8-sig"))
                      for asset in manifest["dataAssets"]:
                          if asset["id"] == "corpus-pdftext-wasm":
                              asset["sha256"] = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
                      data = json.dumps(manifest, indent=2).encode("utf-8")
                  out.writestr(info, data)
          PY
          set +e
          bash .github/scripts/released-data-assets.sh "$RUNNER_TEMP/other-pin.nupkg"
          code=$?
          echo "guard exit: $code"
          [ "$code" -ne 0 ] || { echo "::error::the guard passed a package that pins another archive"; exit 1; }

      # An Update item moves the PDF module's pin after the item the project file writes as a
      # block: the package then ships the moved pin. The guard of the base read the project file's
      # text and saw the block; the guard of this branch reads the package's manifest.
      - name: A pin moved by an Update item (the base's guard passes it, this branch's does not)
        if: matrix.files == 'new' && runner.os == 'Linux'
        run: |
          project=AI/OutWit.Controller.AI.Corpus/OutWit.Controller.AI.Corpus.csproj
          moved=ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
          sed -i "s#</Project>#  <ItemGroup>\n    <ControllerDataAsset Update=\"corpus-pdftext-wasm\" Sha256=\"$moved\" />\n  </ItemGroup>\n</Project>#" "$project"
          tail -5 "$project"
          dotnet build "$project" -c Release -nologo -v:q -p:ContinuousIntegrationBuild=true -p:ControllerBuildStamp=fixed
          package=$(ls AI/OutWit.Controller.AI.Corpus/bin/Release/OutWit.Controller.AI.Corpus.*.nupkg)
          unzip -p "$package" content/module/controller.json | grep -o '"sha256": "[0-9a-f]*"'

          echo "--- the base's guard (the project file's text)"
          set +e
          (
            csproj="$project"
            checked=0
            failed=0
            while read -r block; do
              [ -n "$block" ] || continue
              uri=$(printf '%s' "$block" | sed -n 's#.*<Uri>gh-release://\([^<]*\)</Uri>.*#\1#p')
              pin=$(printf '%s' "$block" | sed -n 's#.*<Sha256>\([0-9a-f]*\)</Sha256>.*#\1#p')
              size=$(printf '%s' "$block" | sed -n 's#.*<Size>\([0-9]*\)</Size>.*#\1#p')
              [ -n "$uri" ] || continue
              checked=$((checked+1))
              url="https://github.com/$(echo "$uri" | cut -d/ -f1-2)/releases/download/$(echo "$uri" | cut -d/ -f3)/$(echo "$uri" | cut -d/ -f4-)"
              file="$RUNNER_TEMP/asset-$checked"
              if ! curl -fsSL --retry 3 -o "$file" "$url"; then echo "  FAIL $uri"; failed=$((failed+1)); continue; fi
              seen=$(sha256sum "$file" | cut -d' ' -f1)
              bytes=$(wc -c < "$file" | tr -d ' ')
              if [ "$seen" = "$pin" ] && [ "$bytes" = "$size" ]; then echo "  OK   $uri  $seen"; else echo "  FAIL $uri"; failed=$((failed+1)); fi
              rm -f "$file"
            done < <(tr -d '\r' < "$csproj" | awk '/<ControllerDataAsset /{block=""; inside=1} inside{block=block $0 " "} /<\/ControllerDataAsset>/{if (inside) print block; inside=0}')
            [ "$checked" -gt 0 ] && [ "$failed" -eq 0 ]
          )
          base=$?
          echo "the base's guard exit: $base"

          echo "--- this branch's guard (the package's manifest)"
          bash .github/scripts/released-data-assets.sh "$package"
          branch=$?
          echo "this branch's guard exit: $branch"

          [ "$base" -eq 0 ] || { echo "::error::expected the base's guard to pass the moved pin (it reads the text)"; exit 1; }
          [ "$branch" -ne 0 ] || { echo "::error::this branch's guard passed a package that ships another pin"; exit 1; }
          echo "as expected: the base's guard passed a package that ships another pin; this branch's guard refused it"

  compare:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: compare-*
          path: compare

      - name: Old and new build files make the same modules, zips and digests
        run: |
          cd compare
          for side in compare-old-Linux compare-new-Linux compare-new-Windows; do echo "$side: SDK $(cat $side/sdk.txt), $(grep -c '^exit=0' $side/build.log) of 12 built"; done
          echo "=== digests, old against new (Linux)"
          diff compare-old-Linux/digests.txt compare-new-Linux/digests.txt && echo "same digests"
          echo "=== snapshot, old against new (Linux): modules, zips, package entries"
          diff compare-old-Linux/snapshot.txt compare-new-Linux/snapshot.txt > snapshot.diff
          cat snapshot.diff
          # A package's own size may differ by its packing metadata; nothing else may differ.
          if grep -E '^[<>]' snapshot.diff | grep -v -E '^[<>]   -- .*\.nupkg \(size [0-9]+\)$'; then
            echo "::error::the build files of this branch change what the builds make"
            exit 1
          fi
          echo "old and new build files: the same modules, zip entries, zips, package entries and digests"

      - name: Linux against Windows with the pinned SDK (information)
        run: |
          cd compare
          diff compare-new-Linux/digests.txt compare-new-Windows/digests.txt && echo "same digests on both systems" || echo "the digests differ between the systems (above)"
          diff <(grep -E '^   ' compare-new-Linux/snapshot.txt | awk '{print $1, $3}') <(grep -E '^   ' compare-new-Windows/snapshot.txt | awk '{print $1, $3}') | head -60 || true
