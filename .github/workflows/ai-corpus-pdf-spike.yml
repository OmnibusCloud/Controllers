name: AI Corpus PDF spike
run-name: "AI Corpus PDF spike: ${{ github.ref_name }}"

# Two managed PDF text extractors (PdfPig, PdfLibrary) on the three node platforms: the PDF
# responses of one Common Crawl WARC file (fetched by range requests from data.commoncrawl.org,
# never committed), the truncated ones after salvage, and a generated hostile set. Every
# document runs in a child process with a deadline and a memory ceiling; the compare job puts
# the text hashes of the three systems side by side.

on:
  workflow_dispatch:
  push:
    branches: ['spike/corpus-pdf']
    paths:
      - 'AI/OutWit.Controller.AI.Corpus.PdfSpike/**'
      - '.github/workflows/ai-corpus-pdf-spike.yml'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      SPIKE: AI/OutWit.Controller.AI.Corpus.PdfSpike
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The stable PdfPig, and the nightly of 2026-11-10 that carries the stack-overflow fixes
      # merged after 0.1.16.
      - name: Build
        run: |
          dotnet build "$SPIKE/OutWit.Controller.AI.Corpus.PdfSpike.csproj" -c Release -o "$RUNNER_TEMP/tool"
          dotnet build "$SPIKE/OutWit.Controller.AI.Corpus.PdfSpike.csproj" -c Release -o "$RUNNER_TEMP/tool-nightly" -p:PdfPigVersion=0.1.17-alpha-202611100027-21de1

      - name: Cache the Common Crawl PDFs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cc
          key: pdf-spike-cc-${{ hashFiles('AI/OutWit.Controller.AI.Corpus.PdfSpike/cc-pdfs.json') }}

      - name: Inputs
        run: |
          tool="dotnet $RUNNER_TEMP/tool/pdf-spike.dll"
          $tool fetch-cc "$SPIKE/cc-pdfs.json" "$RUNNER_TEMP/cc"
          $tool salvage "$SPIKE/cc-pdfs.json" "$RUNNER_TEMP/cc" "$RUNNER_TEMP/salvaged"
          $tool gen-hostile "$RUNNER_TEMP/hostile"
          ls "$RUNNER_TEMP/cc" | wc -l
          dotnet --info | head -20

      - name: Common Crawl PDFs and their salvaged truncated ones
        run: |
          tool="dotnet $RUNNER_TEMP/tool/pdf-spike.dll"
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          nightly="dotnet $RUNNER_TEMP/tool-nightly/pdf-spike.dll"
          for engine in pdfpig pdfpig-budget pdflibrary; do
            $tool batch $engine "$RUNNER_TEMP/cc" "$out/cc-$engine.jsonl" --timeout-s 120 --mem-mb 4096 --texts "$out/texts-cc-$engine" 2> "$out/cc-$engine.log"
            $tool batch $engine "$RUNNER_TEMP/salvaged" "$out/salvaged-$engine.jsonl" --timeout-s 120 --mem-mb 4096 2> "$out/salvaged-$engine.log"
          done
          $nightly batch pdfpig "$RUNNER_TEMP/cc" "$out/cc-pdfpig-nightly.jsonl" --timeout-s 120 --mem-mb 4096 2> "$out/cc-pdfpig-nightly.log"
          $nightly batch pdfpig "$RUNNER_TEMP/salvaged" "$out/salvaged-pdfpig-nightly.jsonl" --timeout-s 120 --mem-mb 4096 2> "$out/salvaged-pdfpig-nightly.log"
          for engine in pdfpig pdflibrary; do
            $tool batch $engine "$RUNNER_TEMP/cc" "$out/cc-$engine-tr-TR.jsonl" --timeout-s 120 --mem-mb 4096 --culture tr-TR 2> "$out/cc-$engine-tr-TR.log"
          done

      - name: Hostile set
        run: |
          tool="dotnet $RUNNER_TEMP/tool/pdf-spike.dll"
          out="$RUNNER_TEMP/out"
          for engine in pdfpig pdfpig-budget pdflibrary; do
            $tool batch $engine "$RUNNER_TEMP/hostile" "$out/hostile-$engine.jsonl" --timeout-s 60 --mem-mb 3072 2> "$out/hostile-$engine.log"
            cat "$out/hostile-$engine.log"
          done
          nightly="dotnet $RUNNER_TEMP/tool-nightly/pdf-spike.dll"
          for engine in pdfpig pdfpig-budget; do
            $nightly batch $engine "$RUNNER_TEMP/hostile" "$out/hostile-$engine-nightly.jsonl" --timeout-s 60 --mem-mb 3072 2> "$out/hostile-$engine-nightly.log"
            cat "$out/hostile-$engine-nightly.log"
          done

      - name: Throughput in one process
        run: |
          tool="dotnet $RUNNER_TEMP/tool/pdf-spike.dll"
          out="$RUNNER_TEMP/out"
          for engine in pdfpig pdflibrary; do
            $tool inproc $engine "$RUNNER_TEMP/cc" "$out/inproc-$engine.jsonl.txt" >> "$out/throughput.txt"
          done
          cat "$out/throughput.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-spike-${{ matrix.os }}
          path: ${{ runner.temp }}/out

  # The wasm route for comparison: pdf-extract (MIT, pure Rust) built for wasm32-wasip1 and run
  # by the wasmtime command line of the line the Verify sandbox ships (48.0.8, pinned), one
  # instance per document with fuel and a linear-memory ceiling.
  wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      SPIKE: AI/OutWit.Controller.AI.Corpus.PdfSpike
      WASMTIME_URL: https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.8/wasmtime-v48.0.8-x86_64-linux.tar.xz
      WASMTIME_SHA256: 8716ce7bffa19d893b5b6dc01d8e298b1a81ab75a0455b5a2933156ea34a456e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the tool
        run: dotnet build "$SPIKE/OutWit.Controller.AI.Corpus.PdfSpike.csproj" -c Release -o "$RUNNER_TEMP/tool"

      - name: Build the extractors for wasm32-wasip1
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1
          rustc +stable -V
          mkdir -p "$RUNNER_TEMP/out"
          for crate in pdftext pdftext-oxide; do
            if cargo +stable build --release --target wasm32-wasip1 --manifest-path "$SPIKE/wasm/$crate/Cargo.toml"; then
              cp "$SPIKE/wasm/$crate/target/wasm32-wasip1/release/$crate.wasm" "$RUNNER_TEMP/out/"
              cp "$SPIKE/wasm/$crate/Cargo.lock" "$RUNNER_TEMP/out/$crate.Cargo.lock"
              sha256sum "$RUNNER_TEMP/out/$crate.wasm"
              ls -l "$RUNNER_TEMP/out/$crate.wasm"
            else
              echo "::warning::$crate did not build for wasm32-wasip1"
            fi
          done

      - name: wasmtime
        run: |
          curl -sSL -o "$RUNNER_TEMP/wasmtime.tar.xz" "$WASMTIME_URL"
          echo "$WASMTIME_SHA256  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          for module in "$RUNNER_TEMP"/out/*.wasm; do
            "$RUNNER_TEMP/wasmtime-v48.0.8-x86_64-linux/wasmtime" compile -W fuel=1 -W nan-canonicalization=y "$module" -o "$RUNNER_TEMP/$(basename "$module" .wasm).cwasm"
          done

      - name: Cache the Common Crawl PDFs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cc
          key: pdf-spike-cc-${{ hashFiles('AI/OutWit.Controller.AI.Corpus.PdfSpike/cc-pdfs.json') }}

      - name: Run
        run: |
          tool="dotnet $RUNNER_TEMP/tool/pdf-spike.dll"
          wt="$RUNNER_TEMP/wasmtime-v48.0.8-x86_64-linux/wasmtime"
          out="$RUNNER_TEMP/out"
          $tool fetch-cc "$SPIKE/cc-pdfs.json" "$RUNNER_TEMP/cc"
          $tool salvage "$SPIKE/cc-pdfs.json" "$RUNNER_TEMP/cc" "$RUNNER_TEMP/salvaged"
          $tool gen-hostile "$RUNNER_TEMP/hostile"
          for module in "$RUNNER_TEMP"/*.cwasm; do
            name="wasm-$(basename "$module" .cwasm)"
            for set in cc salvaged hostile; do
              $tool batch-wasm "$wt" "$module" "$RUNNER_TEMP/$set" "$out/$set-$name.jsonl" --name "$name" --fuel 20000000000 --wasm-mem-mb 1024 --timeout-s 120 --mem-mb 3072 --texts "$out/texts-$set-$name" 2> "$out/$set-$name.log"
              tail -45 "$out/$set-$name.log"
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-route
          path: ${{ runner.temp }}/out

  compare:
    needs: measure
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pdf-spike-*
      - name: Compare
        run: |
          python3 -I AI/OutWit.Controller.AI.Corpus.PdfSpike/compare.py artifacts | tee -a "$GITHUB_STEP_SUMMARY"
