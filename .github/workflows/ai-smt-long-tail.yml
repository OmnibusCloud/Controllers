name: AI Smt long tail
run-name: "AI Smt long tail: ${{ github.event.pull_request.title || github.ref_name }}"

# The long-tail kit of smt-live (AI/OutWit.Controller.AI.Smt.Live/demo/03-long-tail): about two
# thousand SMT-LIB problems of QF_LIA and QF_BV that took Z3 from 1 to 60 seconds at past SMT
# competitions, named by a committed list of paths and hashes and never committed themselves.
#
# - scripts: the tests of the kit's own scripts, the selection (make_list.py) and the check of a
#   run (check.py), on made-up catalogs, archives and runs; no network.
# - read: make_set.py streams the two logics' archives of the SMT-LIB release 2025 from Zenodo
#   (2.4 GB, never stored), keeps the listed files, holds each to the SHA-256 of the list and packs
#   them with smt-live, which reads every row back with the reader the server reads a set with:
#   every one must be taken. The sample the list marks travels to the next job as an artifact.
# - sample: the forty problems of the sample, solved in the controller's sandbox under the kit's
#   options (SmtLongTailSampleTests): every verdict the problem's :status or a budget's end, every
#   model validated, and the fuel and the share the options decide as the test writes them. Never
#   the whole kit. The solver module is the archive of the release the controller's project file
#   names, held with the module in it to the toolchain's pins, as in "AI Smt".
#
# The streams cost minutes and the sample a quarter of an hour. The workflow runs, besides on
# demand, when what its tests hold can change: the kit and its test, the controller (the solver,
# the sandbox's options, the settlement), the wasm host it is built with, the model package (the
# reader and the sanitizer every file goes through), the module's pins, the pinned engine library,
# and smt-live's pack and project, which make the set.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AI/OutWit.Controller.AI.Smt.Live/demo/03-long-tail/**'
      - 'AI/OutWit.Controller.AI.Smt.Tests/Kit/**'
      - 'AI/OutWit.Controller.AI.Smt/**'
      - 'AI/OutWit.Controller.AI.Smt.Model/**'
      - 'AI/OutWit.Controller.AI.Smt.Assets/toolchain/pins.env'
      - 'AI/OutWit.Controller.AI.Smt.Live/Pack/**'
      - 'AI/OutWit.Controller.AI.Smt.Live/OutWit.Controller.AI.Smt.Live.csproj'
      - 'AI/Shared/Wasm/**'
      - 'AI/OutWit.Controller.AI.Verify.Assets/toolchain/natives.sh'
      - 'AI/OutWit.Controller.AI.Verify.Assets/toolchain/pins.env'
      - '.github/workflows/ai-smt-long-tail.yml'

# The jobs read the repository and nothing else: they build and test, and publish nothing.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  KIT: AI/OutWit.Controller.AI.Smt.Live/demo/03-long-tail

jobs:
  scripts:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A discovery that finds no test fails (the runner's Python 3.10 would exit 0 for none).
      - name: The kit's scripts
        shell: bash
        run: |
          set -o pipefail
          python3 -I -m unittest discover -v -s "$KIT/tests" -t "$KIT/tests" 2>&1 | tee "$RUNNER_TEMP/kit.log"
          grep -E "^Ran [1-9][0-9]* tests? in " "$RUNNER_TEMP/kit.log" || { echo "::error::no test of the kit's scripts ran"; exit 1; }

  read:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Build smt-live
        shell: bash
        run: dotnet build AI/OutWit.Controller.AI.Smt.Live/OutWit.Controller.AI.Smt.Live.csproj -c Release

      # A file that is already there with its hash is not fetched again: a stream that breaks
      # leaves its files missing, and the next try fetches only those. The pack prints the set's
      # rows by logic and expected verdict and every row it refuses; it exits 1 on any.
      - name: Fetch and pack the kit
        shell: bash
        run: |
          zstd --version
          work="$RUNNER_TEMP/long-tail"
          for attempt in 1 2 3; do
            if python3 -I "$KIT/make_set.py" "$work"; then
              du -sh "$work/problems" "$work/problems.jsonl"
              cut -f3 "$work/ATTRIBUTION.tsv" | tail -n +2 | sort | uniq -c
              exit 0
            fi
            echo "try $attempt did not end with a whole set"
            sleep 30
          done
          exit 1

      - name: The sample
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smt-long-tail-sample
          path: ${{ runner.temp }}/long-tail/sample
          if-no-files-found: error
          retention-days: 3

  sample:
    needs: read
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TESTS: AI/OutWit.Controller.AI.Smt.Tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache the engine downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: AI/OutWit.Controller.AI.Verify.Tests/@Data/natives/.downloads
          key: verify-engine-natives-${{ hashFiles('AI/OutWit.Controller.AI.Verify.Assets/toolchain/pins.env') }}

      - name: The pinned engine library
        shell: bash
        run: bash AI/OutWit.Controller.AI.Verify.Assets/toolchain/natives.sh AI/OutWit.Controller.AI.Verify.Tests/@Data/natives

      # The archive of the release the project file names, held with the module in it to the pins.
      - name: The solver module under the tests
        shell: bash
        run: |
          . AI/OutWit.Controller.AI.Smt.Assets/toolchain/pins.env
          data="$TESTS/@Data"
          zip="$data/.downloads/smt-z3-wasm.zip"
          url="$(grep -A3 '<ControllerDataAsset Include="smt-z3-wasm">' AI/OutWit.Controller.AI.Smt/OutWit.Controller.AI.Smt.csproj | sed -n 's|.*<Uri>gh-release://\([^/]*\)/\([^/]*\)/\([^/]*\)/\([^<]*\)</Uri>.*|https://github.com/\1/\2/releases/download/\3/\4|p')"
          [ -n "$url" ] || { echo "::error::the project file names no release of smt-z3-wasm"; exit 1; }
          mkdir -p "$data/.downloads"
          curl -fsSL --retry 3 -o "$zip" "$url"
          echo "$SMT_Z3_WASM_SHA256  $zip" | sha256sum -c -
          python3 -I -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$zip" "$data"
          echo "$Z3_MODULE_SHA256  $data/wasm/z3-$Z3_VERSION.wasm" | sha256sum -c -

      - name: The sample's problems
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smt-long-tail-sample
          path: ${{ runner.temp }}/long-tail-sample

      - name: Build
        shell: bash
        run: dotnet build "$TESTS/OutWit.Controller.AI.Smt.Tests.csproj" -c Release

      # The log states each problem's verdict, its fuel as seconds of the reference machine, its
      # wall time here and the peak of the solver's memory, against the time Z3 took at the
      # competition. The test holds each file to the SHA-256 of the list again.
      # Every test the filter selects runs and passes, and it selects at least one.
      - name: Solve the sample
        shell: bash
        env:
          WITAI_SMT_LONG_TAIL_DIR: ${{ runner.temp }}/long-tail-sample
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/long-tail.log"
          dotnet test "$TESTS/OutWit.Controller.AI.Smt.Tests.csproj" -c Release --no-build --filter "Category=LongTail" --logger "console;verbosity=normal" | tee "$log"
          total="$(sed -n 's/^ *Total tests: *\([0-9]*\).*/\1/p' "$log" | tail -1)"
          passed="$(sed -n 's/^ *Passed: *\([0-9]*\).*/\1/p' "$log" | tail -1)"
          if [ "${total:-0}" -eq 0 ] || [ "${passed:-0}" != "$total" ]; then
            echo "::error::the filter Category=LongTail ran ${total:-no} test(s), ${passed:-none} of them passed: it must select at least one, and run every one it selects"
            exit 1
          fi
