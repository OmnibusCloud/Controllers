name: AI SMT SM-0
run-name: "AI SMT SM-0: ${{ github.ref_name }}${{ inputs.select && ' (select)' || '' }}"

# The SM-0 gate of the SMT controller (a spike): Z3 built for wasm32-wasip1 by the pinned
# wasi-sdk of AI/OutWit.Controller.Smt.Spike/toolchain/pins.env, twice, in two folders on two
# runner images, and compared byte for byte; a smoke test under the pinned wasmtime command line.

on:
  workflow_dispatch:
    inputs:
      select:
        description: "Choose the benchmark slice anew from the SMT-LIB 2025 archives (writes a fetch list artifact)"
        type: boolean
        default: false
  push:
    branches:
      - spike/smt-sm0
    paths:
      - 'AI/OutWit.Controller.Smt.Spike/**'
      - 'AI/Shared/Wasm/**'
      - '.github/workflows/ai-smt-sm0.yml'

permissions:
  contents: read

env:
  SPIKE: AI/OutWit.Controller.Smt.Spike
  TOOLCHAIN: AI/OutWit.Controller.Smt.Spike/toolchain

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.name }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a
            os: ubuntu-24.04
          - name: b
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # A build takes about twenty minutes; its output is kept per recipe (the toolchain files),
      # so a run that changes only the harness reuses both builds (each built and compared once).
      - name: Cache the build
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/out
          key: z3-wasm-${{ matrix.name }}-${{ hashFiles('AI/OutWit.Controller.Smt.Spike/toolchain/build.sh', 'AI/OutWit.Controller.Smt.Spike/toolchain/pins.env', 'AI/OutWit.Controller.Smt.Spike/toolchain/patch.py', 'AI/OutWit.Controller.Smt.Spike/toolchain/imports.py', 'AI/OutWit.Controller.Smt.Spike/toolchain/wasi/**') }}

      # Build b runs the scripts from a copy in another folder, with its work folder at
      # another depth: if any path reached the module, the two builds would differ.
      - name: Build
        id: build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BUILD: ${{ matrix.name }}
        run: |
          set +e
          if [ "$BUILD" = a ]; then
            bash "$TOOLCHAIN/build.sh" "$RUNNER_TEMP/out" "$RUNNER_TEMP/work"
          else
            mkdir -p "$RUNNER_TEMP/elsewhere/copy"
            cp -R "$TOOLCHAIN" "$RUNNER_TEMP/elsewhere/copy/toolchain"
            bash "$RUNNER_TEMP/elsewhere/copy/toolchain/build.sh" "$RUNNER_TEMP/out" "$RUNNER_TEMP/b/second/work"
          fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"

      - uses: actions/upload-artifact@v4
        with:
          name: z3-wasm-build-${{ matrix.name }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

      - name: Every download is pinned
        if: steps.cache.outputs.cache-hit != 'true' && steps.build.outputs.code != '0'
        run: |
          echo "::error::a download has no pin yet (UNPINNED lines in the build step)"
          exit 1

  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: z3-wasm-build-*
          path: builds

      - name: The two builds are the same bytes
        run: |
          {
            echo "### z3.wasm: two builds"
            echo
            echo "| file | build a | build b |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in z3.wasm LICENSE-z3.txt; do
            a="$(sha256sum "builds/z3-wasm-build-a/$name" | cut -d' ' -f1)"
            b="$(sha256sum "builds/z3-wasm-build-b/$name" | cut -d' ' -f1)"
            echo "| $name | \`$a\` | \`$b\` |" >> "$GITHUB_STEP_SUMMARY"
            if cmp -s "builds/z3-wasm-build-a/$name" "builds/z3-wasm-build-b/$name"; then
              echo "same bytes: $name  $a"
            else
              echo "::error::$name differs between the two builds: $a and $b"
              exit 1
            fi
          done
          { echo; echo '```'; cat builds/z3-wasm-build-a/build-info.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Run once (workflow_dispatch, select = true): choose the slice from the SMT-LIB 2025
  # archives with the native release as the judge of "solvable in a few seconds". The fetch list
  # it writes is committed; the benchmark files never are.
  select:
    if: ${{ inputs.select }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Native Z3
        run: |
          bash "$TOOLCHAIN/binaries.sh" z3 linux-x64 "$RUNNER_TEMP/z3native" | tail -1 > "$RUNNER_TEMP/z3path"
          cat "$RUNNER_TEMP/z3path"

      - name: Choose the slice
        run: |
          zstd --version
          python3 -I "$SPIKE/bench/select.py" "$TOOLCHAIN/pins.env" "$(cat "$RUNNER_TEMP/z3path")" "$RUNNER_TEMP/select" --jobs 4
          cat "$RUNNER_TEMP/select/select-report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: smt-sm0-fetch-list
          path: |
            ${{ runner.temp }}/select/fetch-list.tsv
            ${{ runner.temp }}/select/select-report.md
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: z3-wasm-build-a
          path: ${{ runner.temp }}/module

      - name: wasmtime
        run: |
          . "$TOOLCHAIN/pins.env"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/wasmtime.tar.xz" "$WASMTIME_URL"
          echo "$WASMTIME_SHA256  $RUNNER_TEMP/wasmtime.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasmtime"
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP/wasmtime" --strip-components=1
          "$RUNNER_TEMP/wasmtime/wasmtime" --version

      - name: Smoke
        run: bash "$TOOLCHAIN/smoke.sh" "$RUNNER_TEMP/wasmtime/wasmtime" "$RUNNER_TEMP/module/z3.wasm" | tee -a "$GITHUB_STEP_SUMMARY"

  # The slice named by bench/fetch-list.tsv, fetched once from the SMT-LIB archives (cached by the
  # list's hash) and handed to the run jobs as an artifact. Nothing of it is committed.
  data:
    if: ${{ !inputs.select }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      ready: ${{ steps.list.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - name: Is there a fetch list
        id: list
        run: |
          if [ -f "$SPIKE/bench/fetch-list.tsv" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "$(($(wc -l < "$SPIKE/bench/fetch-list.tsv") - 1)) problems listed"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "no fetch list yet: run the workflow with select = true and commit its fetch-list.tsv"
          fi

      - name: Cache the slice
        if: steps.list.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/problems
          key: smt-sm0-problems-${{ hashFiles('AI/OutWit.Controller.Smt.Spike/bench/fetch-list.tsv') }}

      - name: Fetch the slice
        if: steps.list.outputs.ready == 'true'
        run: python3 -I "$SPIKE/bench/fetch.py" "$TOOLCHAIN/pins.env" "$SPIKE/bench/fetch-list.tsv" "$RUNNER_TEMP/problems"

      - uses: actions/upload-artifact@v4
        if: steps.list.outputs.ready == 'true'
        with:
          name: smt-sm0-problems
          path: ${{ runner.temp }}/problems
          retention-days: 7
          if-no-files-found: error

  # Every platform runs the same module bytes on the same slice: the wasm sessions (and every
  # fifth problem once more through the unchanged host), the native release as the baseline,
  # the limit cases, and the model evaluator over the sat answers.
  run:
    needs: [compare, data]
    if: needs.data.outputs.ready == 'true'
    name: run ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, rid: win-x64, big: true }
          - { os: ubuntu-24.04, rid: linux-x64, big: true }
          - { os: macos-15, rid: osx-arm64, big: false }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, big: true }
          - { os: windows-11-arm, rid: win-arm64, big: false }
          - { os: macos-15-intel, rid: osx-x64, big: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      RID: ${{ matrix.rid }}
      HARNESS: AI/OutWit.Controller.Smt.Spike/Harness
      BIN: AI/OutWit.Controller.Smt.Spike/Harness/bin/Release/net10.0
      OUT: results-${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: z3-wasm-build-a
          path: module

      - uses: actions/download-artifact@v4
        with:
          name: smt-sm0-problems
          path: problems

      - name: Harness, wasmtime natives, native Z3
        run: |
          dotnet build "$HARNESS" -c Release -nologo -v q
          bash "$TOOLCHAIN/binaries.sh" natives "$RID" "$BIN"
          bash "$TOOLCHAIN/binaries.sh" z3 "$RID" z3native | tail -1 > z3path
          mkdir -p "$OUT"
          cp module/build-info.txt "$OUT/"

      - name: Evaluator self-test
        run: dotnet "$BIN/smt-spike.dll" selftest

      - name: Wasm
        timeout-minutes: 90
        run: dotnet "$BIN/smt-spike.dll" wasm --module module/z3.wasm --cache z3.cwasm --problems problems --list "$SPIKE/bench/fetch-list.tsv" --out "$OUT/results-wasm.jsonl" --batch-every 5

      - name: Native
        timeout-minutes: 60
        run: dotnet "$BIN/smt-spike.dll" native --z3 "$(cat z3path)" --problems problems --list "$SPIKE/bench/fetch-list.tsv" --out "$OUT/results-native.jsonl"

      - name: Limits
        timeout-minutes: 60
        run: |
          BIG=""
          if [ "${{ matrix.big }}" = "true" ]; then BIG="--big"; fi
          if [ "$RID" = "linux-x64" ] || [ "$RID" = "win-x64" ]; then BIG="$BIG --native-big"; fi
          dotnet "$BIN/smt-spike.dll" limits --module module/z3.wasm --cache z3.cwasm --z3 "$(cat z3path)" --out "$OUT/limits.jsonl" $BIG

      - name: Model evaluator
        if: always()
        run: dotnet "$BIN/smt-spike.dll" evaluate --problems problems --list "$SPIKE/bench/fetch-list.tsv" --results "$OUT/results-wasm.jsonl" --out "$OUT/eval.jsonl" | tee "$OUT/eval-summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.rid }}
          path: results-${{ matrix.rid }}
          if-no-files-found: warn

  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results

      - name: Report
        run: |
          set +e
          python3 -I "$SPIKE/bench/report.py" results "$SPIKE/bench/fetch-list.tsv" > report.md
          code=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smt-sm0-report
          path: report.md
