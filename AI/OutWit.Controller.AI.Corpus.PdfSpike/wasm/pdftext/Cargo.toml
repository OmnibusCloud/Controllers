[package]
name = "pdftext"
version = "0.1.0"
edition = "2021"
publish = false
description = "The PDF spike's wasm32-wasip1 extractor: pdf-extract over one file, text out."
license = "MIT"

[dependencies]
pdf-extract = "=0.12.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
